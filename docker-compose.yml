services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - PORT=${BACKEND_PORT:-5050}
    ports:
      - "${BACKEND_PORT:-5050}:5050"
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5050/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - PORT=${FRONTEND_PORT:-3001}
      - REACT_APP_API_BASE_URL=http://localhost:${BACKEND_PORT:-5050}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
